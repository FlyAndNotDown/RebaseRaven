name: Website

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
    secrets:
      GOOGLE_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing latest public release to publish"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: website-release
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      page_url: https://rebaseraven.flyandnotdown.com/
    permissions:
      contents: write
    environment:
      name: website
      url: https://rebaseraven.flyandnotdown.com/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Dependencies
        run: npm ci
      - name: Resolve installer links
        id: downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          mkdir -p "$RUNNER_TEMP/site-release"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/site-release/release.json"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$RUNNER_TEMP/site-release"
          node scripts/site-release-downloads.mjs < "$RUNNER_TEMP/site-release/release.json"
      - name: Build site
        env:
          VITE_GA_APP_MEASUREMENT_ID: ${{ vars.GA_APP_MEASUREMENT_ID }}
          VITE_GA_WEBSITE_MEASUREMENT_ID: ${{ vars.GA_WEBSITE_MEASUREMENT_ID }}
          VITE_RELEASE_DOWNLOADS: ${{ steps.downloads.outputs.release }}
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          const app = process.env.VITE_GA_APP_MEASUREMENT_ID ?? "";
          const website = process.env.VITE_GA_WEBSITE_MEASUREMENT_ID ?? "";
          for (const id of [app, website]) assert.match(id, /^G-[A-Z0-9]{4,20}$/, "Missing or invalid analytics destination.");
          assert.notEqual(app, website, "Desktop and website analytics must use separate destinations.");
          JS
          npm run check:site
      - name: Prepare update source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node --input-type=module <<'JS'
          import path from "node:path";
          import { readFile } from "node:fs/promises";
          import { prepareSiteUpdate } from "./scripts/site-publish.mjs";
          const directory = path.join(process.env.RUNNER_TEMP, "site-release");
          await prepareSiteUpdate({
            directory: "site/dist",
            release: JSON.parse(await readFile(path.join(directory, "release.json"), "utf8")),
            manifestBytes: await readFile(path.join(directory, "latest.json")),
            publicKey: JSON.parse(await readFile("src-tauri/tauri.conf.json", "utf8")).plugins.updater.pubkey,
            repository: process.env.GITHUB_REPOSITORY,
            tag: process.env.RELEASE_TAG,
          });
          JS
          node scripts/check-site.mjs
      - name: Publish static website
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const { publishSite } = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'scripts/site-publish.mjs')).href);
            const sha = await publishSite({ github, context, directory: 'site/dist', tag: process.env.RELEASE_TAG });
            core.info(`Published static website revision ${sha}.`);
      - name: Verify production website
        run: |
          node --input-type=module <<'JS'
          import { setTimeout } from "node:timers/promises";
          import { verifySite } from "./scripts/verify-site.mjs";
          for (let attempt = 1; ; attempt++) {
            try {
              await verifySite({ baseUrl: "https://rebaseraven.flyandnotdown.com/", directory: "site/dist" });
              break;
            } catch (error) {
              if (attempt === 20) throw error;
              console.log(`Waiting for production website (${attempt}/20).`);
              await setTimeout(15000);
            }
          }
          JS

  index:
    name: Submit sitemap
    needs: deploy
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Configuration
        id: configuration
        env:
          IDENTITY_PROVIDER: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const provider = Boolean(process.env.IDENTITY_PROVIDER);
          const account = Boolean(process.env.SERVICE_ACCOUNT);
          if (provider !== account) throw new Error('Search Console configuration is incomplete.');
          appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${provider && account}\n`);
          if (!provider) console.log('::notice::Sitemap submission is not configured; skipping.');
          NODE
      - name: Google authentication
        if: steps.configuration.outputs.enabled == 'true'
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false
      - name: Submit
        if: steps.configuration.outputs.enabled == 'true'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          SEARCH_CONSOLE_PROPERTY: ${{ vars.GOOGLE_SEARCH_CONSOLE_PROPERTY }}
        run: node scripts/submit-sitemap.mjs
